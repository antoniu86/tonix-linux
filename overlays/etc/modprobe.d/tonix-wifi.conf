# Tonix — WiFi driver configuration

# Ensure MediaTek drivers load (AWUS036ACM, AWUS036AXML)
# These should auto-load, but force it just in case
install mt76x2u /sbin/modprobe --ignore-install mt76x2u
install mt7921u /sbin/modprobe --ignore-install mt7921u

# RTL8814AU (AWUS1900) — DKMS-built driver
install 8814au /sbin/modprobe --ignore-install 8814au

# Disable internal WiFi if you only want external adapters (optional)
# Uncomment to block common internal WiFi chipsets:
# blacklist iwlwifi
# blacklist ath9k
# blacklist ath10k_pci
# blacklist brcmfmac
